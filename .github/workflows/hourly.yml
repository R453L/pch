name: hourly-post

on:
  schedule:
    - cron: '0 */3 * * *'   # 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-post
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay to avoid same-time patterns
        shell: bash
        run: |
          RANDOM_DELAY=$((RANDOM % 20))
          echo "Waiting $RANDOM_DELAY minutes before posting..."
          sleep $((RANDOM_DELAY * 60))

      - name: Generate and send post
        run: python bot.py
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL || 'openai' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - name: Save topic history
        shell: bash
        run: |
          set -e
          git config --global user.name "pch-bot"
          git config --global user.email "pch-bot@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update history [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          else
            echo "No changes to commit."
          fi