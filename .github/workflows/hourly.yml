name: hourly-post

on:
  workflow_dispatch:
  # ১. প্রতি ঘণ্টার শুরুতে ট্রিগার করার জন্য শিডিউল যোগ করা হলো
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: hourly-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # ২. টাইমআউট বাড়িয়ে ৬০ মিনিট করা হলো (র্যান্ডম স্লিপের কারণে)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ৩. এখানে নতুন র‍্যান্ডম স্লিপ স্টেপটি যোগ করা হলো (১ থেকে ৫০ মিনিটের মধ্যে যেকোনো সময়)
      - name: Sleep for a random time
        run: |
          DELAY=$((1 + RANDOM % 2))
          echo "Sleeping for $DELAY minutes..."
          sleep $((DELAY * 60))

      - name: Generate and send post
        run: python bot.py
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL || 'openai' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - name: Save topic history
        run: |
          git config user.name "pch-bot"
          git config user.email "pch-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git push)
