name: hourly-post

# Triggered ONLY by cron-job.org (API call). No GitHub schedule here, so there are no double runs.
on:
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run that is posting; a second trigger waits in the queue.
concurrency:
  group: hourly-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send post
        run: python bot.py
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL || 'mistral' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - name: Save topic history
        shell: bash
        run: |
          set -e
          git config --global user.name "pch-bot"
          git config --global user.email "pch-bot@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          else
            echo "No changes to commit."
          fi
