name: hourly-post

on:
  workflow_dispatch: # cron-job.org এই অপশনটিকে প্রতি ৩ ঘণ্টা পর পর হিট করবে
  
  schedule:
    # ম্যাজিক এখানে! cron-job.org প্রথমবার এটাকে চালু করার পর, 
    # স্ক্রিপ্টটি নিজেই নিজের পরবর্তী ৩য় ঘণ্টার জন্য একটি র‍্যান্ডম মিনিট ও ঘণ্টা সেট করে রাখবে।
    # এটি গিটহাবের ব্যাকআপ ক্রন হিসেবে কাজ করবে যা প্রতিবার স্বয়ংক্রিয়ভাবে পরিবর্তিত হবে।
    - cron: '34 */3 * * *'

permissions:
  contents: write

concurrency:
  group: hourly-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # কোনো স্লিপ বা ডিলে নেই! cron-job.org নক দেওয়া মাত্রই সাথে সাথে পোস্ট জেনারেট হবে
      - name: Generate and send post
        run: python bot.py
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL || 'openai' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      # এই স্টেপটি পরবর্তী ৩য় ঘণ্টার জন্য গিটহাবের নিজস্ব ক্রন শিডিউলটি সম্পূর্ণ র‍্যান্ডম করে দেবে
      - name: Calculate and Update Next Random Cron
        shell: bash
        run: |
          set -e
          
          # ০ থেকে ৫৯ এর মধ্যে একটি র‍্যান্ডম মিনিট জেনারেট করা
          RANDOM_MINUTE=$(( RANDOM % 60 ))
          
          # পরবর্তী ৩ ঘণ্টার গ্যাপে রান হওয়ার জন্য ক্রন এক্সপ্রেশন তৈরি
          NEW_CRON="$RANDOM_MINUTE */3 * * *"
          echo "Next calculated cron interval: $NEW_CRON"
          
          # আপনার ওয়ার্কফ্লো ফাইলটির নাম যদি অন্য কিছু হয়, তবে এখানে পরিবর্তন করুন
          WORKFLOW_FILE=".github/workflows/hourly-post.yml"
          
          # ফাইলের ভেতরের পুরনো ক্রন লাইনটি নতুন ক্রন দিয়ে রিপ্লেস করা
          sed -i -E "s/- cron: '.*'/- cron: '$NEW_CRON'/" $WORKFLOW_FILE
          
          git add $WORKFLOW_FILE

      - name: Save topic history and push updates
        shell: bash
        run: |
          set -e

          git config --global user.name "pch-bot"
          git config --global user.email "pch-bot@://github.com"

          git add history.json

          # ক্রন ফাইল বা হিস্ট্রি ফাইল যেকোনো একটি পরিবর্তন হলেই পুশ করবে
          if ! git diff --cached --quiet; then
            git commit -m "bot: update history and random cron schedule [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          else
            echo "No changes to commit."
          fi
